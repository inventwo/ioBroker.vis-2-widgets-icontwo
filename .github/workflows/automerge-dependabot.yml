# Automatically merge Dependabot PRs when version comparison is within the range
# that is configured in .github/auto-merge.yml
#
# Uses pull_request (not pull_request_target): Dependabot PRs get write access
# with pull_request, so the less secure pull_request_target trigger is not required.
# See https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target

name: Auto-Merge Dependabot PRs

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    auto-merge:
        runs-on: ubuntu-latest
        # Only run if actor is dependabot
        if: github.actor == 'dependabot[bot]'

        permissions:
            pull-requests: write
            contents: write

        steps:
            - name: Check if PR should be auto-merged
              uses: iobroker-bot-orga/action-automerge-dependabot@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
